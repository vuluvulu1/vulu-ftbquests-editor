[package]
name = "vulu-ftbquests-editor"
version = "0.3.0"
description = "Edit FTB Quests quest books outside of Minecraft"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "vulu_ftbquests_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
